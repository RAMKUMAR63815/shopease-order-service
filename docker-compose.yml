
services:
  order_mysql:
    image: mysql:8.0
    container_name: shopease_order_mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}

    ports:
      - "3314:3306"

    volumes:
      - order_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  order_api:
    build: .
    container_name: shopease_order_api
    restart: always

    ports:
      - "8014:8000"

    env_file:
      - .env

    environment:
      DATABASE_HOST: order_mysql
      DATABASE_PORT: 3306
      AUTH_SERVICE_URL: http://host.docker.internal:8011
      USER_SERVICE_URL: http://host.docker.internal:8012
      PRODUCT_SERVICE_URL: http://host.docker.internal:8013

    depends_on:
      order_mysql:
        condition: service_healthy

volumes:
  order_mysql_data:
